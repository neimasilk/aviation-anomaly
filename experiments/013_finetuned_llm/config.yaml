# Experiment 013: Fine-Tuned Small LLM with QLoRA
# Fine-tune Phi-3-mini or Mistral-7B on CVR classification

experiment:
  id: "013"
  title: "Fine-Tuned Small LLM (QLoRA)"
  description: "Fine-tune a small LLM (Phi-3-mini-4k or Mistral-7B) using QLoRA 4-bit quantization for CVR anomaly classification. Tests if fine-tuned LLMs outperform BERT+LSTM."
  tags: ["llm", "qlora", "fine-tune", "phi3", "mistral", "peft"]
  created: "2026-02-06"
  status: "pending"

data:
  source: "data/cvr_labeled.csv"
  text_column: "cvr_message"
  label_column: "label"
  case_id_column: "case_id"
  labels: ["NORMAL", "EARLY_WARNING", "ELEVATED", "CRITICAL"]
  window_size: 10
  stride: 5
  test_split: 0.15
  val_split: 0.15
  random_seed: 42

model:
  # Primary: Phi-3-mini (3.8B, fits on single RTX 4080 16GB with 4-bit)
  # Backup: Mistral-7B-v0.3 (needs gradient checkpointing)
  base_model: "microsoft/Phi-3-mini-4k-instruct"
  max_length: 512

  # QLoRA config
  qlora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
    bias: "none"
    task_type: "SEQ_CLS"

  # Quantization
  quantization:
    load_in_4bit: true
    bnb_4bit_compute_dtype: "float16"
    bnb_4bit_quant_type: "nf4"
    bnb_4bit_use_double_quant: true

training:
  batch_size: 2
  gradient_accumulation_steps: 8  # effective batch = 16
  learning_rate: 2e-4
  weight_decay: 0.01
  max_epochs: 3
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  fp16: true

paths:
  output_dir: "outputs/experiments/013"
  checkpoint_dir: "models/013"

device: "auto"
